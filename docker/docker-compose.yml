services:
  flask:
    build:
      args:
        BUILDKIT_PROGRESS: plain
      context: ..
      dockerfile: docker/Dockerfile
    container_name: flask
    depends_on:
      - mongo
      - redis
    deploy:
      replicas: 1
    env_file:
      - .env
    environment: &app-environment
      APP_ENV: ${APP_ENV:-}
      ENABLED_COUNTRIES: ${ENABLED_COUNTRIES:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGODB_CONNECTION: ${MONGODB_CONNECTION:-}
      MONGODB_HOSTNAME: ${MONGODB_HOSTNAME:-}
      OPEN_WEATHER_TOKEN: ${OPEN_WEATHER_TOKEN:-}
      PYTHONPATH: ${PYTHONPATH:-}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis-queue:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REPO_NAME: ${REPO_NAME:-}
      # Compose publishes the container straight on port 80: one proxy (its own nginx).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      TZ: ${TZ:-}
      VOLUME_PATH: ${VOLUME_PATH:-}
    # Same name CI publishes and the cluster pulls, so a local `compose build`
    # and the deployed image cannot drift apart in naming. Compose still builds
    # it locally; the cluster pulls the CI-built one.
    image: ghcr.io/trencho/aqra-backend:latest
    networks:
      - network
    ports:
      # Container listens on 8080 since it runs unprivileged; still published on 80 locally.
      - "80:8080"
    volumes:
      - flask-data:/var/api

  # Same image, different role (docker/launch.sh). The worker trains models and runs every
  # scheduled job; cron only enqueues them. Both share the API's data volume.
  worker:
    command: ["worker"]
    container_name: worker
    depends_on:
      - mongo
      - redis
      - redis-queue
    env_file:
      - .env
    environment: *app-environment
    image: ghcr.io/trencho/aqra-backend:latest
    networks:
      - network
    stop_grace_period: 10m
    volumes:
      - flask-data:/var/api

  cron:
    command: ["cron"]
    container_name: cron
    depends_on:
      - redis-queue
    env_file:
      - .env
    environment: *app-environment
    image: ghcr.io/trencho/aqra-backend:latest
    networks:
      - network

  mongo:
    build:
      args:
        BUILDKIT_PROGRESS: plain
      context: ..
      dockerfile: docker/mongo/Dockerfile
    container_name: mongo
    deploy:
      replicas: 1
    env_file:
      - .env
    environment:
      MONDODB_LOG_DIR: ${MONDODB_LOG_DIR:-}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGODB_DATA_DIR: ${MONGODB_DATA_DIR:-}
    expose:
      - 27017
    image: aqra-mongo:latest
    networks:
      - network
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    command: ["redis-server", "--save", "60", "1"]
    deploy:
      replicas: 1
    expose:
      - 6379
    networks:
      - network
    volumes:
      - redis-data:/data

  # The job queue. Separate from the cache Redis above: a queue must neither evict nor forget,
  # so this one refuses writes when full (noeviction) and keeps an append-only file.
  redis-queue:
    image: redis:8.10.2-alpine
    container_name: redis-queue
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    expose:
      - 6379
    networks:
      - network
    volumes:
      - redis-queue-data:/data

networks:
  network:
    attachable: true
    driver: overlay

volumes:
  flask-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  redis-queue-data:
    driver: local