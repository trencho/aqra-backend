# Define the number of worker processes; recommended value is the number of cores that are being used by your server
worker_processes auto;

# Log to the container's stderr rather than a file. /var/log/nginx is root-owned, and the process is
# unprivileged; sending it to stderr also puts nginx's errors where `kubectl logs` already looks.
error_log /dev/stderr warn;
# /var/run is root-owned, so the pid file moves somewhere the app user can write.
pid /tmp/nginx.pid;

# events block defines the parameters that affect connection processing.
events {
    # Efficient method for connection processing
    use epoll;
    # Define the maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

# http block defines the parameters for how NGINX should handle HTTP web traffic
http {
    # Disable emitting NGINX version on error pages and in the "Server" response header field
    server_tokens off;

    # Include the file defining the list of file types that are supported by NGINX
    include /etc/nginx/mime.types;
    # Define the default file type that is returned to the user
    default_type application/octet-stream;

    # Define the format of log messages.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

#     map $request_uri $loggable {
#       ~^/api/ 1;
#       default 0;
#     }
    # Define the location of the log of access attempts to NGINX
    # stdout for the same reason as error_log above.
    access_log /dev/stdout main;
#     TODO: Test this implementation
#     access_log /var/log/nginx/access.log combined buffer=32k if=$loggable;

    # Define the timeout value for keep-alive connections with the client
    keepalive_timeout 60;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Enable gzip compression for reduced payload size
    gzip on;
    gzip_types application/json image/png;
#     gzip_proxied any;
#     gzip_vary on;
    gzip_comp_level 5;

    # Include additional parameters for virtual host(s)/server(s)
    # include whitelist.conf;

    # Content-Security-Policy per path. The JSON API needs nothing, so it gets nothing. Swagger UI
    # needs its own scripts plus one inline <script> that boots it, and the frontend embeds it in
    # an iframe on the same host, so framing is allowed from 'self' and nowhere else.
    map $uri $content_security_policy {
        ~^/api/v1/(apidocs|flasgger_static|apispec_1\.json) "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'";
        default "default-src 'none'; frame-ancestors 'none'";
    }

#     map $http_referer $limit_referrer {
#         hostnames;
#         default $binary_remote_addr;
#         "~https:\/\/aqra\.feit\.ukim\.edu\.mk.*" "";
#     }

#     limit_req_zone $limit_referrer zone=limit_zone:10m rate=1r/s;

    # Define the parameters for a specific virtual host/server
    server {
        # Define the server name, IP address, and/or port of the server.
        # 8080, not 80: binding a port below 1024 needs CAP_NET_BIND_SERVICE, which the container
        # no longer has now that it runs unprivileged. The Service still publishes 80 and maps to
        # this, so nothing outside the pod changes.
        listen 8080;

        # Define the specified charset to the "Content-Type" response header field
        charset utf-8;

        # Security headers on every response, errors included (`always`). HSTS is set at the
        # ingress, which terminates TLS; this server only ever sees plain HTTP from it.
        add_header Content-Security-Policy $content_security_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

#         limit_req zone=limit_zone;

        # Configure NGINX to reverse proxy HTTP requests to the upstream server (gunicorn - WSGI server)
        location / {
            # Check the files of the proxy server to send the request to
            try_files $uri @app;

            # Redefine the header fields that NGINX sends to the upstream server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Define the location of the proxy server to send the request to
        location @app {
            include proxy_params;
            proxy_pass http://unix:/tmp/gunicorn.socket;
        }

#         location /images/ {
#             alias /var/api/;
#             expires 30d;
#             add_header Cache-Control "public, max-age=2592000";
#         }
    }
}