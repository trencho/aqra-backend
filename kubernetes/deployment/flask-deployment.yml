apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: flask
  name: flask
  namespace: aqra
spec:
  # Must exceed the startupProbe budget below, or the Deployment reports
  # ProgressDeadlineExceeded -- and `kubectl rollout status` fails the deploy -- while the
  # pod is still legitimately starting.
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/aqra-network: "true"
        io.kompose.service: flask
    spec:
      automountServiceAccountToken: false
      # kubelet applies fsGroup ownership to most volume types, but NOT to hostPath -- and
      # flask-data-pvc is backed by one (/mnt/aqra/api on the node, see
      # persistent-volume/flask-data-pv.yml). So a non-root app container would hit EACCES on its
      # first write to /var/api, which is every write it makes.
      #
      # This runs as root, chowns the mount to the app uid, and exits. It is the standard fix for
      # exactly this, and it needs no access to the node: the alternative was a manual
      # `sudo chown` over SSH, which nothing in the repo could perform or re-assert.
      #
      # Idempotent, so it is safe on every rollout. It uses the app image rather than a second
      # image so there is nothing extra to pull, and `chown -R` on an already-correct tree is
      # cheap.
      initContainers:
        - name: fix-data-ownership
          image: ghcr.io/trencho/aqra-backend:latest
          imagePullPolicy: Always
          command: [ "chown", "-R", "1001:1001", "/var/api" ]
          securityContext:
            # runAsNonRoot must be overridden here, not just runAsUser. The pod-level block below
            # applies to init containers too, and kubelet validates it: with runAsNonRoot inherited
            # as true, a container asking for uid 0 is REFUSED at admission with
            # "container has runAsNonRoot and image will run as root", and the pod never starts.
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/api
              name: flask-data
      containers:
        - envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secret
          # Built by CI and pulled from GHCR, not built on the node. The old
          # `aqra-flask` / `Never` pairing required a node-local image, and
          # `docker compose build` writes to Docker's image store while kubelet
          # reads containerd's -- so this Deployment sat in ErrImageNeverPull and
          # /api/v1/* returned 503. Same bug, same fix, as aqra-frontend PR #10.
          image: ghcr.io/trencho/aqra-backend:latest
          imagePullPolicy: Always
          # create_app() no longer fetches anything: the bulk data fetch that used to block
          # gunicorn from binding for minutes runs in the worker (worker-deployment.yml).
          # Booting is now importing the app, so 3 minutes (18 x 10s) of startup grace is
          # plenty. Liveness and readiness stay off until it passes, so a slow import on a
          # busy node is still never mistaken for a hung process.
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /api/v1/healthz/live
              port: 8080
            periodSeconds: 10
          # Takes over only once startupProbe has succeeded, so no initialDelaySeconds
          # is needed here -- boot time is the startup probe's job, not liveness's.
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/healthz/live
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
          # periodSeconds was 300: a readiness check that missed its first attempt did
          # not retry for five minutes, so a perfectly healthy pod stayed out of
          # service -- and the Service kept returning 503 -- for most of that.
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/healthz/ready
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 10
          name: flask
          ports:
            # 8080, not 80: an unprivileged process cannot bind below 1024 without
            # CAP_NET_BIND_SERVICE. The Service still publishes 80 and targets this.
            - containerPort: 8080
          # The pod used to declare nothing while it also trained models. Training is in the
          # worker now; these bound the API alone. Tune from real usage once the cluster is back.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "3Gi"
          volumeMounts:
            - mountPath: /var/api
              name: flask-data
      # Same three keys mongo-deployment.yml and redis-deployment.yml already use. Those two set
      # it and the application they exist for did not, which is what made this an oversight rather
      # than a decision. uid 1001 matches the `app` user created in docker/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      volumes:
        - name: flask-data
          persistentVolumeClaim:
            claimName: flask-data-pvc