apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: redis
  name: redis
  namespace: aqra
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/aqra-network: "true"
        io.kompose.service: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          # Pinned to an exact patch, like every other image in this tree. `redis:8-alpine` is a
          # FLOATING tag: it silently follows the 8 line, so two applies of the same manifest can
          # land different builds and there is no version in git to roll back to. Nothing updates
          # this file automatically -- Kubernetes manifests map to no Dependabot ecosystem, and the
          # trial block that pointed `docker` at /kubernetes produced zero PRs and was removed --
          # so bump it by hand when the base image moves.
          # Kept in step with docker/docker-compose.yml, which Dependabot DOES update: the two
          # drifted to 8.8.1 vs 8.10.0, so dev was testing against a redis production never ran.
          image: redis:8.10.0-alpine
          imagePullPolicy: IfNotPresent
          # Used purely as a shared cache + rate-limit store, so persistence is off and
          # memory is bounded with LRU eviction (all keys carry TTLs).
          #
          # requirepass from redis-secret, which is required: a missing secret fails the rollout
          # instead of starting an open Redis. The NetworkPolicy already limits who can connect;
          # the password covers any pod that matches it.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - >-
              exec redis-server --save "" --appendonly no --maxmemory 256mb
              --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
          # tcpSocket, not `exec: [redis-cli, ping]`. kubelet dials the pod IP from OUTSIDE
          # the container, which is what every client actually does; `redis-cli` with no
          # -h connects to 127.0.0.1 INSIDE the pod, so it certified Redis as Ready without
          # ever establishing that anything outside could reach it.
          #
          # Not theoretical. On 2026-08-19 restart #10 left a zombie container: containerd
          # listed it Running while its OCI task was gone, so the pod sandbox still held
          # the IP with nothing listening on 6379. The exec probe could not run at all --
          # `cannot exec in a stopped container`, 1716 times over 3h39m -- and the pod
          # stayed `Ready: True` throughout, so the Service kept the endpoint published and
          # kube-proxy kept routing flask into a dead container. flask crash-looped for
          # hours on `Error 111 connecting to redis:6379`, and three deploys timed out.
          #
          # A refused TCP connect is an ordinary probe failure, not a runtime error the
          # kubelet cannot even start, so this fails cleanly where the exec could not.
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              # 512Mi against `--maxmemory 256mb`. It was 320Mi, which is only 25% headroom,
              # and Redis was OOMKilled (exit 137) ten times -- the last one 36 seconds after
              # starting. `maxmemory` bounds the DATASET; process RSS additionally carries
              # allocator fragmentation, replication/client output buffers and the odd large
              # value, so the limit has to sit well above it rather than just above it.
              #
              # The dataset ceiling is deliberately left at 256mb: `allkeys-lru` evicts to
              # stay under it, and this is a cache, so evicting is correct where being killed
              # is not. Worth knowing if it recurs: `fetch_dataframe` is `@cache.memoize`d and
              # stores whole pandas DataFrames, so a single large history frame can move a lot
              # of bytes at once.
              memory: "512Mi"
          volumeMounts:
            - mountPath: /data
              name: redis-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      volumes:
        # Ephemeral: it's a cache, so a cold start after a restart is acceptable and
        # avoids provisioning a persistent volume.
        - name: redis-data
          emptyDir: {}
