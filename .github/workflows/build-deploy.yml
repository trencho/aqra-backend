name: Deploy Flask API with MongoDB

on:
  push:
    branches:
      - master
  # Redeploying after an infrastructure fix needed either a commit or
  # `gh run rerun <id> --failed` -- the 2026-08-19 Redis outage was resolved on the node,
  # and there was then no way to ask for a fresh deploy without pushing something. The
  # rollout is idempotent (`kubectl apply` plus a rollout restart), so re-running it
  # against an unchanged master is a no-op when nothing is wrong.
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes previously raced on the same server directory, both running
# git reset --hard concurrently. Deploys now queue instead, and an in-flight one
# is never cancelled half-way through a rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    # A CEILING for the called workflow, not a grant to the tests. ci.yml's `auto-merge` job asks for
    # these three scopes, and GitHub rejects a call whose nested job asks for more than the caller
    # allows, even when that job's `if:` would skip it, which is always here (it runs on Dependabot
    # pull requests only). ci.yml's top-level `permissions` (contents, actions and pull-requests, all
    # read) still apply to `build`, so the tests run with a read-only token. The two read scopes are
    # for its `tested` step, and this ceiling already covers them.
    permissions:
      contents: write
      pull-requests: write
      actions: write

  # The image is built HERE, on the runner, and pushed to GHCR -- not on the
  # deploy host.
  #
  # It used to be built on the node by build_docker_images.sh (`docker compose
  # build`) and consumed with `imagePullPolicy: Never`. That silently stopped
  # working when the node moved to containerd: `docker build` writes to Docker's
  # image store, kubelet reads containerd's, and the two are separate. flask sat
  # in ErrImageNeverPull and /api/v1/* returned 503, while `docker images` on the
  # node cheerfully listed an image the cluster could not see.
  build-and-push:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR. Scoped to this job, not granted workflow-wide.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: :latest for the Deployment to track, and the commit SHA so a
      # specific build can be identified and rolled back to.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Nothing is deployed unless an image was actually published.
    needs: build-and-push
    runs-on: ubuntu-latest

    # A backstop against a hung runner, not a second deadline competing with the
    # rollout budgets -- so it has to sit ABOVE them. deploy_kubernetes_resources.sh
    # allows mongo 10m + redis 10m + flask 20m, and reload_pods.sh then waits on two
    # more rollouts with no --timeout at all, so a slow-but-succeeding deploy can
    # legitimately run for well over half an hour. A tighter value here would kill
    # exactly the deploy it was meant to protect.
    #
    # Without this the default is 6 hours, and because this job holds the
    # deploy-production concurrency group, a genuinely stuck step queues every later
    # deploy behind it for that whole time. One did stall for 18 minutes on
    # `Install OpenVPN` (normally ~10s) on 2026-08-19.
    timeout-minutes: 60

    # Scoped to this job, not the workflow.
    #
    # These 14 are the production deploy credentials -- an SSH private key, the full OpenVPN
    # credential set, and a repo access token. Declared at workflow level they were injected into
    # the environment of every job, so `build-and-push` ran with all of them while needing only
    # GITHUB_TOKEN for GHCR, alongside four third-party actions. Every consumer of every one of
    # these is a step of this job.
    #
    # `test` was never exposed, but by accident rather than design: it is a reusable-workflow call
    # (`uses: ./.github/workflows/ci.yml`), and a called workflow does not inherit the caller's
    # env.
    env:
      OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
      OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
      OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
      CA_CERT: ${{ secrets.CA_CERT }}
      CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
      TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
      USER_KEY: ${{ secrets.USER_KEY }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GIT_REPO_PATH: ${{ secrets.GIT_REPO_PATH }}
      GIT_REPO_USERNAME: ${{ secrets.GIT_REPO_USERNAME }}
      GIT_REPO_NAME: ${{ secrets.GIT_REPO_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OPENVPN_CONFIG holds a *path*, and it is a secret, so when the file is
      # missing the VPN action reports `config file '***' not found` -- masked,
      # and therefore impossible to act on. That is exactly what happened in
      # aqra-frontend when the .ovpn was deleted as "unreferenced": the only
      # reference lived in the secret, so grep found nothing and two days went
      # into diagnosing it.
      #
      # Fail here instead, before the two-minute apt install, and say which file
      # this repository actually ships.
      - name: Verify the OpenVPN config file exists
        run: |
          if [ ! -f "${OPENVPN_CONFIG}" ]; then
            echo "::error::OPENVPN_CONFIG names a file that is not in the checkout."
            echo "The secret must hold a path, relative to the repository root, to an"
            echo "OpenVPN config. This repository ships one at:"
            echo "    .github/workflows/client.ovpn"
            echo "Present in .github/workflows right now:"
            ls -A .github/workflows
            exit 1
          fi
          echo "OpenVPN config found."

      # Cache the .debs so a degraded Ubuntu mirror cannot stall the deploy. GitHub's cache
      # service is a different network path from the mirror, so a HIT bypasses apt entirely --
      # which is the whole point, after this step stalled 18 minutes three times on 2026-08-19.
      # A MISS still goes to apt, so the retry loop below stays exactly as it was.
      #
      # The key carries the runner image build because the dependency closure differs per image
      # and a .deb set restored against a different one can half-install; and the package list,
      # so changing what is installed invalidates it. Deliberately NO restore-keys: a prefix
      # near-miss would restore a set built for another image, which is the failure this key
      # exists to prevent.
      # ImageOS/ImageVersion live in the runner's PROCESS environment, NOT in the `env`
      # expression context - so `${{ env.ImageOS }}` expands to an EMPTY STRING and the key
      # collapses to a constant that hits forever, serving .debs built for a retired image.
      # That is not hypothetical: the first run of this change saved `apt-openvpn-Linux--`.
      # Resolve them in a step, where they do exist, and fail loudly if they ever stop.
      - name: Resolve the runner image for the cache key
        id: runner_image
        run: |
          set -u
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error::ImageOS/ImageVersion are unset - the cache key would be constant"
            exit 1
          fi
          echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # restore + save as SEPARATE steps, not `actions/cache`, and the save runs on
      # `always()`. The combined action saves in a post step gated on `success()`, so a job
      # that fails AFTER this install -- which is every failing deploy since 2026-08-19 --
      # discards the .debs it just downloaded. The cache could then only ever appear on
      # master once a master deploy had already succeeded, which is the thing it exists to
      # protect. That circularity is why this cache had never served a single master run.
      - name: Restore the OpenVPN packages
        id: aptcache
        uses: actions/cache/restore@v6
        with:
          path: .aptcache
          key: apt-openvpn-${{ runner.os }}-${{ steps.runner_image.outputs.id }}

      - name: Install OpenVPN
        # Required, not incidental: the connect action below installs nothing -- it writes
        # the config and keys and runs `sudo openvpn` -- and openvpn is not on the runner
        # image. This came from that action's own README.
        #
        # openvpn-systemd-resolved is NOT installed any more. It only does anything when the
        # config invokes its script via an `up` directive, and client.ovpn has no `up`/`down`
        # and no `script-security` -- without which OpenVPN refuses to run such a script at
        # all. It has never been doing anything here.
        #
        # Each apt call is bounded individually so a stall is KILLED and retried rather than
        # hanging silently. `sudo timeout` rather than `timeout sudo`, so the signal reaches
        # apt-get itself instead of the sudo wrapper it would otherwise stop at.
        # timeout-minutes is only a backstop for the loop as a whole.
        timeout-minutes: 10
        run: |
          set -u
          echo "runner image: ImageOS=${ImageOS:-<unset>} ImageVersion=${ImageVersion:-<unset>}"

          # Cache hit: install from the .debs without touching the network at all.
          if ls .aptcache/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i .aptcache/*.deb; then
              echo "OpenVPN installed from cache: $(openvpn --version | head -1)"
              exit 0
            fi
            echo "::warning::cached .debs did not install (runner image probably changed); falling back to apt"
          fi

          # Miss: download into the cached dir so the next run hits. Dir::Cache::archives is
          # repo-local because /var/cache/apt/archives is root-owned and actions/cache saves
          # as `runner`; the chown below is why the post-step can read what apt wrote.
          mkdir -p .aptcache/partial
          install_openvpn() {
            sudo timeout 60 apt-get update -o Acquire::Retries=3 \
              && sudo timeout 90 apt-get install -y --no-install-recommends \
                   -o Acquire::Retries=3 -o Dir::Cache::archives="$(pwd)/.aptcache" openvpn
          }
          for attempt in 1 2 3; do
            if install_openvpn; then
              sudo chown -R "$(id -u):$(id -g)" .aptcache
              echo "OpenVPN installed on attempt ${attempt}: $(openvpn --version | head -1)"
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} did not finish within its budget; retrying"
            sleep 10
          done
          echo "::error::could not install OpenVPN after 3 attempts"
          exit 1


      - name: Create necessary OpenVPN key files
        run: |
          sudo mkdir -p /etc/openvpn
          echo "${CA_CERT}" | sudo tee /etc/openvpn/ca.crt > /dev/null
          echo "${CLIENT_CERT}" | sudo tee /etc/openvpn/client.crt > /dev/null
          echo "${TLS_CRYPT_KEY}" | sudo tee /etc/openvpn/tls-crypt.key > /dev/null

      # Save even when the deploy fails; skip it on a hit, because re-saving an unchanged
      # entry under the same key is a no-op that only logs a warning.
      - name: Save the OpenVPN packages
        if: always() && steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .aptcache
          key: apt-openvpn-${{ runner.os }}-${{ steps.runner_image.outputs.id }}

      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@cd2ed8a90cc7b060dc4e001143e811b5f7ea0af5 # v3.1.0
        with:
          config_file: ${{ env.OPENVPN_CONFIG }}
          echo_config: false
          username: ${{ env.OPENVPN_USERNAME }}
          password: ${{ env.OPENVPN_PASSWORD }}
          client_key: ${{ env.USER_KEY }}

      - name: SSH commands for checkout/update git repo, build and deploy
        id: remote_deploy
        # Failure is handled by the retry step below rather than failing the job here.
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          # The action's default command_timeout is 10m, but flask's startupProbe
          # allows up to 15 minutes for its boot-time data fetch and the deploy script
          # blocks on `kubectl rollout status`. Without this the SSH step is killed
          # mid-rollout and the deploy reports failure for a pod that was starting
          # normally.
          command_timeout: 25m
          # Bounds the CONNECTION, not the command. Left unset, a dead peer burned
          # 159s before reporting `handshake failed` on the sibling repo.
          timeout: 30s
          # The script is a file so the retry below points at it rather than carrying a
          # second copy of it, and envs forwards the values it needs -- which also stops
          # five secrets being interpolated into the script text.
          envs: ACCESS_TOKEN,GIT_REPO_NAME,GIT_REPO_PATH,GIT_REPO_USERNAME,SSH_USERNAME
          script_path: .github/workflows/remote_deploy.sh

      # Retry once on ANY failure, without asking how long the first attempt took.
      #
      # This used to gate on `elapsed < 120`, reasoning that anything further in must be a
      # real failure not worth repeating. Both deploys in this fleet falsified that on
      # 2026-08-19. Here the run took 324s: 64s to connect, 11s of git, 248s of `chown -R`,
      # and under a second for the entire Kubernetes deploy -- so 313 of those 324 seconds
      # were setup, and the gate declined a free retry while the clock was almost entirely
      # measuring a recursive chown. On the sibling repo the SSH handshake HUNG for 159s
      # and never opened a session at all. Elapsed time stood in for progress and measured
      # neither.
      #
      # The asymmetry decides it: `remote_deploy.sh` is idempotent by construction -- the
      # checkout is `git reset --hard`, the deploy is `kubectl apply` plus read-only waits
      # -- so a wasted retry costs minutes, while a declined retry costs a red master and
      # an undeployed production. Retry, and let the second attempt's own exit code fail
      # the job if it fails too.
      - name: SSH commands for checkout/update git repo, build and deploy (retry)
        if: steps.remote_deploy.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          # The action's default command_timeout is 10m, but flask's startupProbe
          # allows up to 15 minutes for its boot-time data fetch and the deploy script
          # blocks on `kubectl rollout status`. Without this the SSH step is killed
          # mid-rollout and the deploy reports failure for a pod that was starting
          # normally.
          command_timeout: 25m
          # Bounds the CONNECTION, not the command. Left unset, a dead peer burned
          # 159s before reporting `handshake failed` on the sibling repo.
          timeout: 30s
          envs: ACCESS_TOKEN,GIT_REPO_NAME,GIT_REPO_PATH,GIT_REPO_USERNAME,SSH_USERNAME
          script_path: .github/workflows/remote_deploy.sh

