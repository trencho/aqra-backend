name: CI

on:
  # No docs-only `paths:` filter, deliberately. master's branch protection requires the `build`
  # check, and a filtered workflow never reports on a PR it skips, so a README-only PR would wait
  # for that check for ever.
  pull_request:
  # Invoked by build-deploy.yml on master so the deploy is gated on green tests
  # (keeping the steps in one place instead of duplicating them).
  workflow_call:
  # Runs the tests against any ref without deploying it, e.g. master while the deploy is disabled.
  workflow_dispatch:

# actions: read and pull-requests: read let build's `tested` step find the merged pull request and
# its CI jobs. Without them those calls 403 and the step falls back to running the checks. Granted
# here because `build` has no job-level block; `auto-merge` has its own block and ignores this one.
# build-deploy.yml's `test` job already allows both as part of its ceiling.
permissions:
  contents: read
  actions: read
  pull-requests: read

# A newer push supersedes an in-flight run for the same ref. Never on master: the
# deploy calls this workflow via `workflow_call`, and cancelling there would cancel
# the tests the deploy is gated on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Skips Black, Ruff and the tests when a pull request already passed them on this exact tree.
      # The step runs only on a push to master (build-deploy.yml's call) or on a dispatch from
      # `auto-merge`, which uses GITHUB_TOKEN and so triggers as github-actions[bot]. It skips only
      # when all three hold: this commit is a merged PR's merge commit, the PR head has the
      # identical tree, and a pull_request run of ci.yml on that head has its `build` job at
      # success. The lookup reads the job, not the run, because `auto-merge` dispatches from inside
      # the PR run before it concludes, and a failed dispatch fails that run with `build` green.
      # Everything else runs the checks: a direct push, a PR merged while behind master, a failed,
      # missing or cancelled `build`, and any API error. On a pull request or a manual dispatch the
      # step does not run, its output is empty and every check runs, so dispatching CI by hand is
      # the way to get an extra seed. The owner accepted the cost on 2026-10-18: master no longer
      # tries a second shuffle seed per merge.
      - name: Check whether a pull request already tested this tree
        id: tested
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The display name the jobs API reports for this job on a pull_request run.
          JOB_NAME: build
        run: |
          tested=false
          reason="no merged pull request has this commit as its merge commit"
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\"") ||
            { pr=""; reason="the pull request lookup failed"; }
          if [ -n "$pr" ]; then
            num=${pr%% *}
            head=${pr##* }
            merged_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || merged_tree=""
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || head_tree=""
            if [ -z "$merged_tree" ] || [ "$merged_tree" != "$head_tree" ]; then
              reason="#$num's head tree differs from the merged tree"
            elif ! runs=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | .id'); then
              reason="the workflow run lookup for #$num's head failed"
            else
              reason="no successful '$JOB_NAME' job on #$num's head ${head:0:7}"
              for id in $runs; do
                if ! count=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                  --jq "[.jobs[] | select(.name == \"$JOB_NAME\" and .conclusion == \"success\")] | length"); then
                  reason="the job lookup for run $id failed"
                  continue
                fi
                case $count in
                  '' | *[!0-9]*) continue ;;
                esac
                if [ "$count" -gt 0 ]; then
                  tested=true
                  reason="#$num's head ${head:0:7} has the same tree and its '$JOB_NAME' job passed in run $id"
                  break
                fi
              done
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then verdict="Formatting, lint and tests skipped"; else verdict="Formatting, lint and tests run"; fi
          echo "$verdict: $reason"
          echo "$verdict: $reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # Every file the install reads, not just the one it is pointed at. `pip install -r
          # requirements/dev.txt` follows that file's first line, `-r common.txt`, where 30 of
          # the 38 direct pins live -- so keying on dev.txt alone meant editing common.txt did
          # not invalidate the cache. Same shape as the trading-bot key fixed in 0.1.36.
          #
          # Honest scope: pip's is a DOWNLOAD cache keyed by URL, so a stale restore degrades
          # the hit rate rather than installing versions nobody chose. The convention violation
          # is identical; the correctness consequence is milder than for a package-manager cache
          # that restores a resolved tree.
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Check formatting (Black)
        if: steps.tested.outputs.tested != 'true'
        run: black --check src tests definitions.py

      - name: Lint imports (Ruff)
        if: steps.tested.outputs.tested != 'true'
        run: ruff check src tests definitions.py

      # Every run shuffles the tests (pytest-randomly), so a test that leans on another's leftovers
      # fails here rather than after an unrelated rename reorders the suite. The seed is the run id,
      # so a re-run replays the same order: fix the test, or dispatch CI for a new seed. The log and
      # the run summary name the seed. Reproduce locally with `pytest --randomly-seed=<seed>`.
      # pytest-randomly hands the seed to every xdist worker, so `-n logical` keeps one order.
      - name: Run tests
        if: steps.tested.outputs.tested != 'true'
        env:
          SEED: ${{ github.run_id }}
        run: |
          echo "Shuffled test order, seed $SEED"
          echo "Shuffled test order, seed \`$SEED\`" >> "$GITHUB_STEP_SUMMARY"
          pytest -p randomly --randomly-seed="$SEED"

  # Lands a Dependabot PR once `build` passes. This replaced dependabot-auto-merge.yml, which polled
  # the check-runs API for named checks and paid for a sleep loop on every bot PR. As a job in this
  # workflow the gate is `needs:`: a failed or skipped `build` skips this job and the PR stays open,
  # and re-running a failed `build` re-runs the merge with it.
  #
  # Every update type merges, majors included. A pre-release target or a workflow-modifying
  # (github_actions) bump is held for a human.
  #
  # Gated on the PR's AUTHOR, not `github.actor`: the actor is whoever triggered this run, so a human
  # touching the branch (an "Update branch" click, a rebase) would turn the condition false. The
  # event check keeps it off the `workflow_call` from build-deploy.yml, which runs as a push.
  #
  # The write grants are this job's own; `build` keeps the read-only top-level token. Because
  # build-deploy.yml calls this file, its `test` job must allow these three scopes as a ceiling, or
  # GitHub rejects the whole deploy run before it starts. See the comment there.
  auto-merge:
    needs: [build]
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To dispatch build-deploy.yml on master after the merge; see DISPATCH_WORKFLOW below.
      actions: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Pre-release guard: the one thing that does NOT auto-merge. Registries expose a release
      # channel, but the docker/docker-compose ecosystems match image TAGS, which carry none -- so
      # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR and would merge
      # into a production image (it did, 2026-08-15). It cannot be expressed in dependabot.yml:
      # ignore.versions takes version RANGES, not globs (dependabot-core#15154).
      #
      # `new-version` is empty on a GROUPED PR, so the raw metadata JSON is checked too: if any
      # updated dependency looks like a pre-release, the whole PR is held. Failing toward "hold"
      # is deliberate -- a missed merge is a nuisance, a shipped release candidate is an incident.
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` -- which is empty on exactly the
          # grouped PRs the metadata check exists to cover.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
        run: |
          gh pr comment "$PR_URL" --body "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human to confirm it is intended."

      # Actions bumps REWRITE A WORKFLOW FILE, and the workflows here can read the production
      # deploy secrets. SHA pinning is the control that makes a third-party action safe, and a
      # Dependabot bump rewrites the pin itself -- so auto-merging one accepts whatever SHA
      # upstream published, with no human in the loop.
      #
      # The VALUE is `github_actions`, with an UNDERSCORE. `dependabot.yml` spells the same
      # ecosystem `github-actions` with a hyphen, and a guard matching the hyphen holds nothing
      # while looking exactly like a working gate. Read off a real run's
      # `outputs.package-ecosystem:` log line, not assumed.
      - name: Hold a workflow-modifying bump for a human
        id: workflow_hold
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          held=false
          if [ "${ECOSYSTEM:-}" = "github_actions" ]; then
            held=true
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "github_actions bump - a workflow change needs a human, not auto-merging."
          fi

      # Said on the PR, not only in the log. A hold nobody is told about is indistinguishable from
      # a gate that silently stopped working.
      - name: Explain a held workflow bump
        if: ${{ steps.workflow_hold.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump modifies a **workflow file**, and the workflows here can read the production deploy secrets. SHA pinning is what makes a third-party action safe, and this bump rewrites the pin itself, so merging it accepts whatever SHA upstream published. Review the diff and merge manually."

      - name: Merge, then dispatch the deploy on the base branch
        if: ${{ steps.prerelease.outputs.held == 'false' && steps.workflow_hold.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh workflow run` takes its repository from GH_REPO or the git remote, and this job has
          # no checkout. Without it the dispatch fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The head commit `build` tested. `--match-head-commit` refuses the merge if the branch has
          # moved since; the newer push has its own CI run, and that run decides.
          SHA: ${{ github.event.pull_request.head.sha }}
          # THE WORKFLOW TO DISPATCH AFTER A SUCCESSFUL MERGE, and why one is needed at all.
          #
          # `gh pr merge` pushes with GITHUB_TOKEN, and a push made with GITHUB_TOKEN raises NO
          # workflow events. build-deploy.yml listens on `push: master`, so without this nothing
          # tests the merged head, builds an image or deploys it. Measured across this repo's history
          # on 2026-09-19: every Dependabot PR merged by `app/github-actions` raised no deploy, and
          # every one merged by a human did.
          #
          # The deploy, not ci.yml, because the deploy listens on push and is the run that never
          # comes; it calls ci.yml itself, so the merged head is still tested first. A dispatch is
          # the one event GITHUB_TOKEN may raise. Set to empty to opt out.
          DISPATCH_WORKFLOW: build-deploy.yml
          DISPATCH_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # If the branch is BEHIND, ask Dependabot to rebase and stop. master requires `strict` status
          # checks, so GitHub refuses a stale branch.
          #
          # Ask DEPENDABOT to update the branch; do NOT use `gh pr update-branch` here. A branch
          # updated with GITHUB_TOKEN gets no CI run (GitHub raises no workflow events for its own
          # token), so its new head could never satisfy this job's `needs:`. Dependabot's own push
          # does trigger CI, and that run reaches this job again.
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "branch is behind the base; asked Dependabot to rebase. Its CI run will merge it."
            exit 0
          fi

          if gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$SHA"; then
            if [ -n "${DISPATCH_WORKFLOW:-}" ]; then
              if gh workflow run "$DISPATCH_WORKFLOW" --ref "$DISPATCH_REF"; then
                echo "merged, and dispatched $DISPATCH_WORKFLOW on $DISPATCH_REF so the change ships."
              else
                # A failed dispatch FAILS this job. The merge has landed and a re-run cannot undo it,
                # but a warning on a green job is read by nobody; a red check on the merged PR is
                # what someone sees. While build-deploy.yml is disabled this fails on every merge,
                # which is accurate: nothing merged in that window ships until the deploy runs.
                echo "::error::merged, but could not dispatch $DISPATCH_WORKFLOW on $DISPATCH_REF. This change will NOT ship until it runs: gh workflow run $DISPATCH_WORKFLOW --ref $DISPATCH_REF"
                exit 1
              fi
            fi
            exit 0
          fi

          # A sibling PR landing while this run was testing can leave the branch behind. Hand it back
          # to Dependabot rather than failing, for the reason given above.
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "merge refused: branch fell behind; asked Dependabot to rebase."
            exit 0
          fi
          # Any other refusal is real and stays loud. Seen in the wild: GitHub blocks a GITHUB_TOKEN
          # merge of a PR that edits a workflow file, and `--match-head-commit` refuses a branch that
          # moved after `build` tested it.
          echo "::error::merge refused while mergeStateStatus=$state."
          exit 1
