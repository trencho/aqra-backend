name: Security scan

# Weekly OSV vulnerability scan of the dependency tree, deliberately decoupled from the test / deploy
# gate: a newly-published advisory surfaces as a scheduled red (and notifies the owner) without ever
# blocking a PR or a deploy. Uses the plain OSV-Scanner action (no SARIF upload), so no GitHub
# Advanced Security is required; the job fails if OSV finds a known vulnerability. The job compiles
# the fully-pinned trees itself rather than reading committed locks; the step below says why. Record any
# reviewed, accepted advisory in osv-scanner.toml (scoped to the exact ID) so it goes red only when a
# NEW one lands.
on:
  schedule:
    - cron: "03 7 * * 1" # weekly, Monday 07:03 UTC - fleet slot (minutes staggered per repo)
  # No `push`. A push to master is a squash of the tree the `pull_request` run checked minutes
  # earlier, and this scan uploads no SARIF, so a master run re-answers a question already answered.
  # The gap that accepts: a dependency change pushed straight to master, bypassing a PR, waits for the
  # weekly run. Dependencies here arrive through Dependabot PRs, and Dependabot's alerts cover that.
  #
  # `pull_request` runs only when something the scan READS changes: the requirements files it
  # compiles, OSV's config, or this file. Any other PR would re-scan the tree master already has,
  # which the weekly schedule covers.
  pull_request:
    paths:
      - requirements/*.txt
      - osv-scanner.toml
      - .github/workflows/security-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact pin, unlike the major-tag pins elsewhere in this repo: astral-sh publishes floating
      # major tags only up to v7 while the current release is v10.1.0, so `@v10` does not resolve.
      # Same style as the osv-scanner pin below. Dependabot's github-actions ecosystem keeps it current.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compile the dependency trees
        # WHY THESE ARE COMPILED HERE AND NOT COMMITTED.
        #
        # OSV needs fully-pinned trees: a direct-only requirements file leaves transitives unpinned,
        # so OSV resolves each to its oldest-compatible version and reports false positives. Those
        # trees used to be requirements/prod.lock and dev.lock, regenerated by hand, which made them
        # derived files only a human could refresh. That failed in both directions:
        #
        #   On a PR. Dependabot bumps the .txt manifests and cannot run `uv pip compile`, so every pip
        #   PR arrived carrying locks without the versions it proposed. The `pull_request` trigger
        #   exists to catch an advisory BEFORE it lands, and on the only PRs that introduce new
        #   versions it was reading the tree being replaced. The same drift failed ci.yml's
        #   lock-agreement guard by construction, which is the half that was visible: PR #82 sat red
        #   on it. The guard's own comment records the locks drifting twice in August 2026, the
        #   second time within an hour of being fixed by hand.
        #
        #   On master. Measured 2026-09-16 with the manifests unchanged: EIGHT transitives had moved
        #   in prod and NINE in dev since the last hand-regeneration (pyjwt 2.13.0 against 2.14.0,
        #   threadpoolctl 3.6.0 against 3.7.0, greenlet 3.5.5 against 3.5.6, and more). The guard
        #   could not see any of it: it compared the DECLARED pins, and the transitives are the whole
        #   reason the files exist.
        #
        #   On the wrong platform, which is the worst of the three. The locks were last compiled on
        #   Windows. Measured against the first ubuntu compile: they carried `tzdata` (and `colorama`
        #   in dev), which no runner installs, and they were MISSING `nvidia-nccl-cu13`, which
        #   xgboost pulls on Linux and which common.txt therefore ships into the production image.
        #   OSV had never seen that package at all. A phantom entry costs a false positive; an
        #   absent one means a real shipped dependency was never scanned.
        #
        # All three shapes hide an advisory rather than invent one, which is the direction that costs
        # something. Compiling in the job, on the platform that runs the code, makes all three
        # unrepresentable.
        #
        # prod.txt and dev.txt each chain in common.txt via `-r`, so compiling them reproduces the
        # same two trees the locks held. --python-version pins resolution to the version the tests
        # run, so the markers match the tree that actually installs.
        run: |
          uv pip compile requirements/prod.txt \
            --python-version 3.14 --strip-extras --no-header -q -o requirements/prod.lock
          uv pip compile requirements/dev.txt \
            --python-version 3.14 --strip-extras --no-header -q -o requirements/dev.lock
          echo "prod: $(grep -c '^[A-Za-z]' requirements/prod.lock) packages"
          echo "dev:  $(grep -c '^[A-Za-z]' requirements/dev.lock) packages"

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # prod.lock = runtime tree, dev.lock = runtime + dev tooling. `.lock` isn't an
          # OSV-recognized name, so force the pip parser with the `<parse-as>:<path>` form.
          # `--no-resolve` because OSV treats a requirements-format lock as a manifest and ALSO runs
          # a resolver, which can fail "resolution impossible" (exit 127) on a tree that scans clean
          # when pinned.
          scan-args: |-
            --no-resolve
            -L
            requirements.txt:requirements/prod.lock
            -L
            requirements.txt:requirements/dev.lock

      - name: Keep the trees this run scanned
        # Replaces what the committed locks used to provide, and records it better than they did:
        # dated, tied to one run, and unable to disagree with what OSV actually read. Kept on failure
        # too, which is when knowing the exact versions matters most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-trees-${{ github.run_id }}
          path: |
            requirements/prod.lock
            requirements/dev.lock
          retention-days: 90
