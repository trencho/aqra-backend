# Dependabot version updates. Grouping minor+patch keeps majors in their own PR, so a breaking
# major fails CI alone. Every update type auto-merges once CI passes (ci.yml, job `auto-merge`).
# Dependabot applies `ignore` retroactively: landing this auto-closes offending open PRs.
version: 2
updates:
  # Python deps. The requirements files live under /requirements (common/dev/prod, chained via -r).
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # pymongo 4.18 supports MongoDB 4.4 as its MINIMUM server, and the Kubernetes deployment
    # runs exactly 4.4 (the node has no AVX). pymongo raises that floor in minor releases, and
    # every update here auto-merges, so a routine bump could cut production off its database.
    # Patches still flow; a minor or major waits until Mongo moves.
    ignore:
      - dependency-name: pymongo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: ci

  # Dockerfile base images (docker/Dockerfile + the mongo image).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: chore
    # No update-type restriction: majors, minors and patches all flow, and the guard that matters
    # for images -- blocking a RELEASE-CANDIDATE tag -- lives in ci.yml's auto-merge job instead.
    # It has to: `docker` matches TAGS, which carry no release-channel metadata, so
    # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR, and
    # `ignore.versions` takes version RANGES rather than globs (dependabot-core#15154), so
    # "no pre-releases" cannot be written here at all.

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in /docker were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore

  # A Kubernetes-manifest block lived here as a TRIAL (docker ecosystem pointed at
  # /kubernetes). It was removed on 2026-08-18 having met its own stated delete criterion:
  # several weekly runs across 2026-08-15 and 08-17 produced ZERO manifest PRs. Kubernetes
  # is not on Dependabot's public ecosystem table, and a config that implies coverage it
  # does not have is worse than no config. Do not roll it to aqra-frontend.
