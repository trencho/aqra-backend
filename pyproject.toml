# Tooling config. Formatting stays with Black (defaults); Ruff is used only for import hygiene
# so it complements rather than fights Black. (Pytest config lives in pytest.ini.)
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# F401 = unused imports, F811 = redefinition/shadowing, I = import ordering.
# `I` was missing: unused imports were gated and their ORDER was not, so a hand-added import
# in the wrong block passed CI and only showed up as diff noise in the next person's commit.
select = ["F401", "F811", "I"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files intentionally re-export their public API; those imports are not "unused".
"__init__.py" = ["F401"]

# Configuration for deptry, which the monthly dependency-cleanup job runs.
#
# Without it the report was 73 issues, nearly all false -- and a report that is mostly noise
# trains everyone to stop reading it, which costs more than having no report at all. Nothing
# is suppressed here for being inconvenient: every entry is something static analysis cannot
# see. Anything genuinely unused is left VISIBLE on purpose (see psutil, below).
[tool.deptry]
# The application packages live under src/ and import as top-level names (`api`, `processing`,
# ...). Without this every internal import is reported as an undeclared dependency.
known_first_party = [
    "api", "backup", "caching", "definitions", "modeling", "models", "preparation", "processing",
    "repository", "services", "settings", "utils", "visualization", "worker",
]

[tool.deptry.per_rule_ignores]
# DEP002 = "declared but not imported". Each of these is genuinely used, just never by an
# `import` this codebase contains:
#   gunicorn        production entrypoint runs it as a command
#   black / ruff    formatter and linter, invoked by CI
#   pytest, pytest-xdist, pytest-randomly, Flask-Testing   test tooling, invoked as commands
#   pandas-stubs / scipy-stubs            type stubs, consumed by the type checker only
#   py-unused-deps  a dependency-analysis tool, invoked as a command
#
#   fakeredis       imported only under tests/, which deptry excludes by default
#   scipy           never imported directly; pinned so it moves in step with scipy-stubs (scikit-learn
#                   needs it anyway)
#
# `psutil` used to sit in requirements/common.txt (production) with no import anywhere; the compiled
# prod tree showed it arriving only `via -r requirements/common.txt`. Removed 2026-11-02. Dev still
# gets it through the pytest-xdist[psutil] extra in dev.txt.
DEP002 = [
    "gunicorn", "black", "ruff", "pytest", "pytest-xdist", "pytest-randomly", "Flask-Testing",
    "pandas-stubs", "scipy-stubs", "py-unused-deps", "fakeredis", "scipy",
]

# Distributions whose import name differs from the package name. Without this deptry reports each
# one twice: DEP002 for the package and DEP001 for the import.
[tool.deptry.package_module_name_map]
PyGithub = "github"
scikit-learn = "sklearn"
pymongo = ["pymongo", "bson", "gridfs"]
